<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obsługa stolika</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="logo">RESTAURACJA XYZ</div>

        <div class="table">
            Stolik <span id="tableNumber">17</span>
        </div>

        <h1>W czym możemy pomóc?</h1>

        <p class="subtitle">
            Wybierz, czego potrzebujesz
        </p>

        <div class="buttons">

            <button data-request="Poproś o kelnera">
                🛎️
                <span>Poproś o kelnera</span>
            </button>

            <button data-request="Woda">
                💧
                <span>Poproś o wodę</span>
            </button>

            <button data-request="Sztućce">
                🍴
                <span>Poproś o sztućce</span>
            </button>

            <button data-request="Serwetki">
                🧻
                <span>Poproś o serwetki</span>
            </button>

            <button data-request="Rachunek">
                💳
                <span>Poproś o rachunek</span>
            </button>

        </div>

        <button class="other" data-request="Inna prośba">
            ❓ Inna prośba
        </button>

        <button class="review" id="reviewButton">
            ⭐ Oceń nas w Google
        </button>

        <div id="message"></div>

    </main>

    <script src="app.js"></script>

</body>
</html>
